services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: parcel_delivery
      POSTGRES_USER: parcel
      POSTGRES_PASSWORD: parcel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"

volumes:
  postgres-data: