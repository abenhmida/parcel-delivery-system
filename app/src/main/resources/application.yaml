server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    password: ${DATABASE_USERNAME:parcel}
    username: ${DATABASE_PASSWORD:parcel}
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/parcel_delivery}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: parcel-delivery-events
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed

    producer:
      acks: all
      enable-idempotence: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: parcel-event:com.krizaldis.parceldelivery.events.ParcelEvent

parcel:
  kafka:
    topic: parcel-events
    dead-letter-topic: parcel-events.DLT

  outbox:
    poll-delay-ms: 1000

  consumer:
    max-concurrency: 8
    concurrency: 3
    processing-timeout-ms: 5000